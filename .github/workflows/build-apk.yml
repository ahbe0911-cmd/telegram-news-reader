name: Build Telegram News Reader APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-news-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Generate Android platform scaffold
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android \
              --project-name telegram_news_reader \
              --org com.example \
              --no-pub .
          fi
          mkdir -p android/app/src/main
          cp tool/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          fi

      - name: Set up Python for launcher icon
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate branded launcher icons
        run: |
          python -m pip install pillow
          python tool/generate_launcher_icons.py

      - name: Prepare bundled Persian font
        run: bash tool/prepare_fonts.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Isar and Riverpod code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: telegram-news-reader-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 30
