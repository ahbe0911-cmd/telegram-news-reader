name: Build Telegram News Reader APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-news-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Generate Android platform scaffold
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android \
              --project-name telegram_news_reader \
              --org com.example \
              --no-pub .
          fi
          mkdir -p android/app/src/main
          cp tool/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          fi

      - name: Prepare bundled Persian font
        run: bash tool/prepare_fonts.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Isar and Riverpod code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_DIR="build/app/outputs/flutter-apk"
          test -s "$APK_DIR/app-arm64-v8a-release.apk"
          TAG="apk-${GITHUB_SHA::7}"
          gh release create "$TAG" "$APK_DIR"/*-release.apk \
            --target "$GITHUB_SHA" \
            --title "Telegram News Reader APK ${GITHUB_SHA::7}" \
            --notes "ABI-specific release APKs generated by the validated GitHub Actions build. Most modern Android phones use arm64-v8a." \
            --prerelease
