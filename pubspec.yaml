name: telegram_news_reader
description: A Persian RTL Flutter reader for public Telegram channel posts.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8

  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1

  dio: ^5.11.1
  xml: ^7.1.0
  html: ^0.15.7

  cached_network_image: ^4.0.6
  photo_view: ^0.15.0
  video_player: ^2.14.1
  chewie: ^1.17.4
  flutter_cached_pdfview: ^0.4.4
  file_saver: ^0.7.0
  permission_handler: ^12.0.3

  path_provider: ^2.1.6
  shimmer: ^4.0.0
  intl: ^0.20.3
  url_launcher: ^6.3.3
  handy_tdlib_next: ^2.3.16
  flutter_secure_storage: ^11.2.0
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.10
  isar_community_generator: ^3.4.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
